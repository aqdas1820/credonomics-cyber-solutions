name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify OCR data
        run: ./setup-model.ps1 -OcrOnly
      - name: Run tests
        run: python -m pytest -q
  static-quality:
    name: Static quality (informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-dev.txt
      - name: Ruff
        continue-on-error: true
        run: python -m ruff check .
      - name: Format review
        continue-on-error: true
        run: python -m ruff format --check .
      - name: Type review
        continue-on-error: true
        run: python -m mypy cyber tests scripts
